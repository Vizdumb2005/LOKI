# Machine-Readable Mentalism Technique Dataset (Directive §16)
# Maps documented mentalism methods to computational primitives, ML models, and policy constraints.

techniques:
  - name: "Barnum / Forer Effect"
    mechanism: "High-level generalized character or feature statements that participants interpret as uniquely tailored."
    required_information: "Broad population priors and soft demographic / behavioral signals."
    visible_participant_action: "Reading generated persona/character statements and validating accuracy."
    hidden_system_state: "Broad cluster assignment with low posterior certainty."
    confidence_requirements: "Low (posterior top-1 mass 0.20 - 0.45)."
    failure_modes:
      - "Over-specificity causing explicit participant rejection."
      - "Excessive vagueness causing participant disinterest."
    psychological_basis: "Forer (1949), Dickson & Kelly (1985) subjective validation effect."
    digital_translation: "Generating personalized-sounding character templates from coarse cluster features."
    measurable_effect: "Maintains engagement while gathering initial evidence without explicit interrogation."

  - name: "Cognitive Priming and Choice Architecture"
    mechanism: "Subtle UI/UX visual saliency, default positioning, and delayed onset cues to bias choices."
    required_information: "Plausible candidate hypothesis with moderate-to-high prior probability."
    visible_participant_action: "Option selection in direct multiple-choice turns."
    hidden_system_state: "Dominant favorite identified (top-1 mass >= 0.60)."
    confidence_requirements: "Moderate-High (posterior top-1 mass >= 0.60)."
    failure_modes:
      - "Participant defies the force by deliberately picking non-salient options."
      - "Coercive visual layout causing loss of perceived agency."
    psychological_basis: "Meyer & Schvaneveldt (1971), Kuhn et al. (2014) perceptual priming and choice bias."
    digital_translation: "UI saliency glow, default list positioning, and delayed emphasis in direct turns."
    measurable_effect: "Increases selection probability of target candidate by 15-30% without explicit coercion."

  - name: "Choice Blindness and Illusion of Agency"
    mechanism: "Framing interaction outcomes so participants believe they freely arrived at the predicted target."
    required_information: "Session interaction history and candidate selection trace."
    visible_participant_action: "Confirming or reacting to the final reveal."
    hidden_system_state: "Tracked sequence of participant selections vs forced / guided candidates."
    confidence_requirements: "High (posterior top-1 mass >= 0.70)."
    failure_modes:
      - "Participant explicitly remembers being steered or restricted."
      - "Explicit rejection of the final reveal as inaccurate."
    psychological_basis: "Johansson et al. (2005) choice blindness."
    digital_translation: "Highlighting participant agency in reveal phrasing ('You chose to focus on...')."
    measurable_effect: "Maximizes perceived participant freedom score on post-session evaluation."

  - name: "Memory Effects & Retrospective Distortion"
    mechanism: "Structuring post-session reveals to highlight direct hits and compress visible question steps."
    required_information: "Complete turn history, hits, and missed fishing attempts."
    visible_participant_action: "Reviewing session summary and ledger outcome."
    hidden_system_state: "Optimized reveal log suppressing intermediate backtracking steps."
    confidence_requirements: "High (posterior top-1 mass >= 0.75)."
    failure_modes:
      - "Participant meticulously tracks and logs question count during session."
      - "Exposing full raw question history without theatrical summary."
    psychological_basis: "Loftus (1979), Wiseman et al. (2003) reconstructive memory distortion."
    digital_translation: "Framing outcome summaries around key intuitive hits rather than raw question counts."
    measurable_effect: "Reduces perceived question count (I_visible) compared to actual interaction turns."

  - name: "False Attribution of Causality"
    mechanism: "Presenting passive behavioral signals (latency, gaze dwell) as the source of intuitive insight."
    required_information: "Passive telemetry stream (gaze dwell, response latency, typing rhythm)."
    visible_participant_action: "Interacting naturally with UI controls and timing pauses."
    hidden_system_state: "Fused passive reliability modulations attached to Bayesian updates."
    confidence_requirements: "Moderate (posterior top-1 mass >= 0.50)."
    failure_modes:
      - "Participant detects explicit telemetry tracking and feels monitored."
      - "Overclaiming precision from noisy telemetry data."
    psychological_basis: "Matute et al. (2015) illusion of causality."
    digital_translation: "Annotating reveal beats with references to subtle behavioral cues ('I noticed a brief hesitation...')."
    measurable_effect: "Elevates perceived impossibility by attributing predictions to unstated cues."

  - name: "Equivocation (Magician's Choice)"
    mechanism: "Retroactively reframing missed or ambiguous choices into seamless performance branches."
    required_information: "Participant response signal and current posterior distribution."
    visible_participant_action: "Submitting a negative, ambiguous, or unexpected answer."
    hidden_system_state: "Equivocation state queued in performance engine without altering Bayesian state."
    confidence_requirements: "Any confidence level following a missed or ambiguous turn."
    failure_modes:
      - "Blatant, unconvincing backtracking that reveals algorithm logic."
      - "Contradicting previously established facts."
    psychological_basis: "Corinda (1958) theatrical choice manipulation."
    digital_translation: "Queuing dynamic reframe lines ('Precisely as expected—we discard that direction...')."
    measurable_effect: "Prevents session breakdown after wrong guesses and maintains narrative continuity."

  - name: "Multiple Outs & Reveal Planning"
    mechanism: "Maintaining multiple viable reveal paths and selecting the most impactful route dynamically."
    required_information: "Top-k candidate distribution, attribute clusters, and confidence spread."
    visible_participant_action: "Observing the multi-stage reveal sequence."
    hidden_system_state: "Selected reveal path (progressive ladder, category cluster, dual deduction, hesitation)."
    confidence_requirements: "Path-dependent (Decisive ladder >= 0.85, Category cluster >= 0.60, Hesitation 0.60-0.85)."
    failure_modes:
      - "Revealing a low-confidence candidate on a decisive path."
      - "Mismatched category cluster phrasing."
    psychological_basis: "Annemann (1938) multiple outcomes architecture."
    digital_translation: "Branching reveal planner staging the reveal across path templates."
    measurable_effect: "Maximizes reveal success rate even when top-1 hypothesis is not 100% certain."

  - name: "One-Ahead Principle"
    mechanism: "Gathering information or evaluating hypotheses for future targets under cover of current actions."
    required_information: "Multi-target relationship graphs or downstream hypothesis dependencies."
    visible_participant_action: "Answering prompt for current active stage."
    hidden_system_state: "Background inference engine evaluating future target probabilities."
    confidence_requirements: "Low-Moderate (early to mid session)."
    failure_modes:
      - "Prematurely leaking future target information in current dialogue."
    psychological_basis: "Corinda (1958) asynchronous secret gathering."
    digital_translation: "Asynchronous background computation of future entropy partitions while user answers current prompt."
    measurable_effect: "Zero perceived delay on complex multi-step inferences."

  - name: "Dual Reality"
    mechanism: "Structuring prompts so the participant perceives one constraint while the engine tracks broader context."
    required_information: "Dual interpretation mappings for dialogue templates."
    visible_participant_action: "Selecting options under participant-facing interpretation."
    hidden_system_state: "Dual-coded hypothesis state mapping selection to rich semantic attributes."
    confidence_requirements: "Moderate (posterior top-1 mass 0.40 - 0.70)."
    failure_modes:
      - "Participant realizes prompt ambiguity and questions intent."
    psychological_basis: "Knepper (1990s) asymmetric perception."
    digital_translation: "Interface prompts with surface simplicity and deep semantic tagging."
    measurable_effect: "Gathers high-dimensional evidence from seemingly simple choices."

  - name: "Cold Reading & Covert Fishing"
    mechanism: "Disguising high-information probing questions as intuitive cold-reading statements."
    required_information: "High-information binary or ternary attribute dimensions with credible candidates."
    visible_participant_action: "Responding via natural language or agreement buttons ('Yes', 'Sort of', 'Not really')."
    hidden_system_state: "Soft Bayesian update with non-zero likelihood vectors across all hypotheses."
    confidence_requirements: "Credible candidate threshold (top-mass >= 0.40)."
    failure_modes:
      - "Over-fishing causing participant to feel interrogated."
      - "Hard elimination on noisy user denials."
    psychological_basis: "Hyman (1977), Rowland (2002) cold reading and soft feedback integration."
    digital_translation: "Covert fishing turn execution with soft agreement likelihood updating."
    measurable_effect: "Reduces visible interrogation bits (I_visible) while preserving accuracy."

  - name: "Bayesian Prior Exploitation"
    mechanism: "Leveraging population priors and conditional attribute distributions for rapid probability leaps."
    required_information: "Target candidate database with population frequency priors."
    visible_participant_action: "Providing initial demographic or contextual anchor."
    hidden_system_state: "Non-uniform prior probability initialization $P(H_i)$."
    confidence_requirements: "Initial session setup."
    failure_modes:
      - "Biased priors causing systematic misses on rare/unconventional targets."
    psychological_basis: "Statistical decision theory and population stereotyping priors."
    digital_translation: "Conditioning initial hypothesis posteriors on target population priors."
    measurable_effect: "Reduces expected turns to resolution by 1.5 - 2.5 questions."

  - name: "Information Entropy Reduction"
    mechanism: "Selecting questions or observations that maximize Expected Information Gain (EIG)."
    required_information: "Full hypothesis posterior and attribute matrix."
    visible_participant_action: "Answering direct question."
    hidden_system_state: "EIG calculation across all unasked questions."
    confidence_requirements: "Any active session state."
    failure_modes:
      - "Mechanical, robotic question sequence (Akinator pattern)."
    psychological_basis: "Shannon (1948) information theory."
    digital_translation: "Information-gain question policy selecting maximum expected entropy reduction."
    measurable_effect: "Minimizes mathematical turns required to identify target."

  - name: "Reveal Escalation and Pacing"
    mechanism: "Staging final reveal across progressive stages (Category -> Attribute -> Identity)."
    required_information: "Target attributes, category clusters, and identity details."
    visible_participant_action: "Following multi-beat reveal sequence."
    hidden_system_state: "Staged reveal plan execution."
    confidence_requirements: "High (posterior top-1 mass >= 0.80)."
    failure_modes:
      - "Abrupt single-line reveal without dramatic build-up."
    psychological_basis: "Theatrical suspense construction and pacing."
    digital_translation: "Multi-beat reveal planner rendering progressive attribute ladder."
    measurable_effect: "Increases surprise and perceived mind-reading quality ratings."

  - name: "Strategic Hesitation & Faked Uncertainty"
    mechanism: "Injecting artificial doubt and pauses during reveal when confidence is in doubt window."
    required_information: "Current posterior top-1 mass and confidence boundaries."
    visible_participant_action: "Observing hesitation beats ('Wait... something else is coming through...')."
    hidden_system_state: "Doubt window check (top-1 mass between 0.60 and 0.85)."
    confidence_requirements: "Calibrated doubt window (0.60 <= top-1 mass <= 0.85)."
    failure_modes:
      - "Faking uncertainty when top-1 mass is extremely low or 100% certain."
    psychological_basis: "Perceived realism and human imperfection heuristics."
    digital_translation: "Hesitation beat injection in reveal planner."
    measurable_effect: "Eliminates search-engine perception and elevates perceived human-like intuition."
