      - {id: "yes", label: "Yes", predicate: {attr: venom, op: eq, value: true}}
      - {id: "no",  label: "No",  predicate: {attr: venom, op: eq, value: false}}
  - id: q_stripes
    text: "Does it wear stripes?"
