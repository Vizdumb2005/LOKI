      - {id: "no",  label: "No",  predicate: {attr: fly, op: eq, value: false}}
  - id: q_farm
    text: "Would you find it on a farm?"
    reliability: 0.95
    answers:
      - {id: "yes", label: "Yes", predicate: {attr: farm, op: eq, value: true}}
      - {id: "no",  label: "No",  predicate: {attr: farm, op: eq, value: false}}
  - id: q_night
    text: "Does it prefer the night?"
    reliability: 0.92
    answers:
      - {id: "yes", label: "Yes", predicate: {attr: night, op: eq, value: true}}
      - {id: "no",  label: "No",  predicate: {attr: night, op: eq, value: false}}
  - id: q_venom
    text: "Does it carry venom?"
    reliability: 0.96
