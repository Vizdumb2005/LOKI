prior: uniform
termination:
  entropy_threshold_bits: 0.25
  max_turns: 12
questions:
  - id: q_class
    text: "Which of nature's families does it belong to?"
    reliability: 0.97
    answers:
      - {id: mammal,    label: A mammal,             predicate: {attr: cls, op: eq, value: mammal}}
      - {id: bird,      label: A bird,               predicate: {attr: cls, op: eq, value: bird}}
      - {id: fish,      label: A fish,               predicate: {attr: cls, op: eq, value: fish}}
      - {id: reptile,   label: A reptile,            predicate: {attr: cls, op: eq, value: reptile}}
      - {id: amphibian, label: An amphibian,         predicate: {attr: cls, op: eq, value: amphibian}}
      - {id: arachnid,  label: A spider or scorpion, predicate: {attr: cls, op: eq, value: arachnid}}
      - {id: insect,    label: An insect,            predicate: {attr: cls, op: eq, value: insect}}
  - id: q_eggs
    text: "Did it hatch from an egg?"
    reliability: 0.96
    answers:
      - {id: "yes", label: "Yes", predicate: {attr: eggs, op: eq, value: true}}
      - {id: "no",  label: "No",  predicate: {attr: eggs, op: eq, value: false}}
  - id: q_meat
    text: "Does it eat other creatures?"
    reliability: 0.94
    answers:
      - {id: "yes", label: "Yes", predicate: {attr: meat, op: eq, value: true}}
      - {id: "no",  label: "No",  predicate: {attr: meat, op: eq, value: false}}
  - id: q_domestic
    text: "Do humans keep it as a pet or companion?"
    reliability: 0.95
    answers:
      - {id: "yes", label: "Yes", predicate: {attr: dom, op: eq, value: true}}
      - {id: "no",  label: "No",  predicate: {attr: dom, op: eq, value: false}}
  - id: q_big
    text: "Is it larger than you are?"
    reliability: 0.95
    answers:
      - {id: "yes", label: "Yes", predicate: {attr: big, op: eq, value: true}}
      - {id: "no",  label: "No",  predicate: {attr: big, op: eq, value: false}}
  - id: q_water
    text: "Does it live in or around water?"
    reliability: 0.95
    answers:
      - {id: "yes", label: "Yes", predicate: {attr: water, op: eq, value: true}}
      - {id: "no",  label: "No",  predicate: {attr: water, op: eq, value: false}}
  - id: q_fly
    text: "Can it fly?"
    reliability: 0.97
    answers:
